# Postgres with the pgvector extension for the RAG (stage 2).
# Port 5435 to avoid clashing with bank-resilience-lab (5433/5434).
#   docker compose -f docker/docker-compose.yml up -d
services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: ai-lab-pgvector
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: ai_lab
    ports:
      - "${AI_LAB_PG_PORT:-5435}:5432"
    volumes:
      - ai-lab-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d ai_lab"]
      interval: 5s
      retries: 10

volumes:
  ai-lab-pgdata:
