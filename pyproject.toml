[project]
name = "ai-lab"
version = "0.1.0"
description = "AI engineering lab: LLM fundamentals, RAG, evals, agents and guardrails, one step at a time."
readme = "README.md"
authors = [
    { name = "robsonprod", email = "rbsazevedo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "langchain-core>=1.7.3",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langchain-voyageai>=0.4.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
ai-lab = "ai_lab.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Claude API (costs money). Run with --live.",
    "integration: needs Docker (Testcontainers + pgvector).",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
